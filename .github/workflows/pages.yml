name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static files
        run: |
          node --check assets/app.js
          test -s index.html
          test -s 404.html
          test -s assets/style.css
          test -s assets/keyvan-avatar.jpg
          test -s assets/og.png
          test -s about/index.html
          test -s projects/index.html
          test -s teaching/index.html
      - name: Stage public files
        run: |
          mkdir -p site
          cp index.html 404.html robots.txt sitemap.xml .nojekyll site/
          cp -R assets site/
          cp -R about projects teaching site/
      - name: Refresh GitHub activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py --json site/assets/activity.json --svg site/assets/activity.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
